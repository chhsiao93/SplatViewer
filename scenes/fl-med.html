<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Flooding — Medium Level</title>
  <script type="importmap">
  { "imports": { "playcanvas": "https://cdn.jsdelivr.net/npm/playcanvas@latest/build/playcanvas.mjs" } }
  </script>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@playcanvas/web-components@0.6.0/dist/pwc.mjs"></script>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
    pc-app { display: block; width: 100%; height: 100%; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<pc-app antialias="false" high-resolution="false">
  <pc-asset src="https://cdn.jsdelivr.net/npm/playcanvas/scripts/esm/camera-controls.mjs"></pc-asset>
  <pc-asset id="terrain-asset" src="https://huggingface.co/datasets/chhsiao93/hicss-splat/resolve/main/splats/flood_input_bound.sog"></pc-asset>
  <pc-asset id="truck-asset"   src="https://huggingface.co/datasets/chhsiao93/hicss-splat/resolve/main/splats/flood_med_truck.sog"></pc-asset>
  <pc-asset id="water-asset"   src="https://huggingface.co/datasets/chhsiao93/hicss-splat/resolve/main/splats/flood_med_water.sog"></pc-asset>
  <pc-scene>
    <pc-entity id="camera" name="camera" position="-0.1 0.15 -0.15">
      <pc-camera></pc-camera>
      <pc-scripts>
        <pc-script name="cameraControls"></pc-script>
      </pc-scripts>
    </pc-entity>
    <pc-entity id="terrain" name="terrain" position="0 0 0" rotation="-90 0 0">
      <pc-gsplat asset="terrain-asset"></pc-gsplat>
    </pc-entity>
    <pc-entity id="truck" name="truck" position="0 0 0" rotation="-90 0 0">
      <pc-gsplat asset="truck-asset"></pc-gsplat>
    </pc-entity>
    <pc-entity id="water" name="water" position="0 0 0" rotation="-90 0 0">
      <pc-gsplat asset="water-asset"></pc-gsplat>
    </pc-entity>
  </pc-scene>
</pc-app>

<!-- UI overlay -->
<div style="position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;">

  <div id="loading" style="position:absolute;inset:0;background:rgba(3,7,18,0.8);backdrop-filter:blur(4px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;">
    <div style="width:32px;height:32px;border:2px solid #3b82f6;border-top-color:transparent;border-radius:50%;animation:spin .75s linear infinite"></div>
    <p style="color:#9ca3af;font-size:14px;font-family:system-ui,sans-serif;margin:0">Loading scene…</p>
  </div>

  <div style="position:absolute;top:12px;right:12px;background:rgba(0,0,0,0.6);border-radius:6px;overflow:hidden;font-family:ui-monospace,monospace;font-size:12px;color:#4ade80;">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;padding:4px 10px;border-bottom:1px solid rgba(255,255,255,0.08)"><span style="color:rgba(255,255,255,.4)">FPS</span><span id="fps">—</span></div>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;padding:4px 10px;border-bottom:1px solid rgba(255,255,255,0.08)"><span style="color:rgba(255,255,255,.4)">Splats</span><span id="splats">—</span></div>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;padding:4px 10px"><span style="color:rgba(255,255,255,.4)">VRAM</span><span id="vram">—</span></div>
  </div>

  <div style="position:absolute;bottom:12px;left:12px;background:rgba(0,0,0,0.6);border-radius:6px;padding:8px 12px;font-family:system-ui,sans-serif;font-size:13px;color:#e5e7eb;pointer-events:auto;">
    <div style="font-size:10px;font-weight:600;color:rgba(255,255,255,.4);text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px">Layers</div>
    <label style="display:flex;align-items:center;gap:8px;padding:3px 0;cursor:pointer"><input type="checkbox" checked data-entity="terrain"> Terrain</label>
    <label style="display:flex;align-items:center;gap:8px;padding:3px 0;cursor:pointer"><input type="checkbox" checked data-entity="truck"> Truck</label>
    <label style="display:flex;align-items:center;gap:8px;padding:3px 0;cursor:pointer"><input type="checkbox" checked data-entity="water"> Water</label>
  </div>

</div>

<script type="module">
  import { Vec3 } from 'playcanvas';
  const pcApp = document.querySelector('pc-app');

  const loading = document.getElementById('loading');
  document.querySelector('pc-asset[src$=".sog"]')?.addEventListener('load', () => loading.style.display = 'none', { once: true });
  setTimeout(() => loading.style.display = 'none', 8000);

  const fmtV = b => !b ? '—' : b/1048576 >= 1000 ? (b/1073741824).toFixed(1)+' GB' : (b/1048576).toFixed(0)+' MB';
  const fmtN = n => n == null ? '—' : n >= 1e6 ? (n/1e6).toFixed(1)+'M' : n >= 1e3 ? (n/1e3).toFixed(1)+'K' : ''+n;
  let att = 0, fc = 0, t0 = performance.now();
  const poll = setInterval(() => {
    if (!pcApp.app) { if (++att > 100) clearInterval(poll); return; }
    clearInterval(poll);
    (function tick(now) {
      fc++;
      if (now - t0 >= 500) {
        const s = pcApp.app.stats;
        document.getElementById('fps').textContent    = Math.round(fc * 1000 / (now - t0));
        document.getElementById('splats').textContent = fmtN(s.frame?.gsplats);
        document.getElementById('vram').textContent   = fmtV(s.vram?.totalUsed);
        fc = 0; t0 = now;
      }
      requestAnimationFrame(tick);
    })(performance.now());
  }, 100);

  document.querySelectorAll('[data-entity]').forEach(cb =>
    cb.addEventListener('change', () => {
      const el = document.getElementById(cb.dataset.entity);
      if (el?.entity) el.entity.enabled = cb.checked;
    })
  );

  const FOCUS = new Vec3(0.2, 0.0, 0.1);
  (function tryFocus() {
    const ctrl = document.getElementById('camera')?.entity?.script?.cameraControls;
    if (ctrl) ctrl.focusPoint = FOCUS;
    else requestAnimationFrame(tryFocus);
  })();
</script>

</body>
</html>
